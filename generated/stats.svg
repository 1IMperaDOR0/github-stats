
<svg width="360" height="230" xmlns="http://www.w3.org/2000/svg">

  <style>
    text{
      font-family:monospace;
      letter-spacing:.6px;
    }

    .label{
      fill:#8b949e;
      font-size:14px;
    }

    .value{
      fill:#c9d1d9;
      font-size:15px;
      font-weight:bold;
    }

    .score{
      fill:#58a6ff;
      font-weight:bold;
    }

    .title{
      font-size:22px;
      font-weight:700;
    }
  </style>

  <defs>
    <linearGradient id="titleGrad">
      <stop offset="0%" stop-color="#ff4ecd"/> 
      <stop offset="100%" stop-color="#8f8cff"/> 
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="18" fill="#010409"/>

  <text x="20" y="40" class="title" fill="url(#titleGrad)">
    GitHub Stats
  </text>

  <line x1="20" y1="55" x2="340" y2="55" stroke="#30363d"/>

  <text x="20" y="80" class="label">Stars</text>
  <text x="150" y="80" class="value">7</text>

  <text x="20" y="110" class="label">Commits</text>
  <text x="150" y="110" class="value">449</text>

  <text x="20" y="140" class="label">PRs</text>
  <text x="150" y="140" class="value">2</text>

  <text x="20" y="170" class="label">Issues</text>
  <text x="150" y="170" class="value">0</text>

  <text x="20" y="200" class="label">Score</text>
  <text x="150" y="200" class="score">455</text>

</svg>
