  fill="#3178c6" rx="6"/>
  
  <rect x="277.49514115248815" y="0" width="8.97460249291687" height="12"
  fill="#b07219" rx="6"/>
  
  <rect x="286.469743645405" y="0" width="7.466187665663283" height="12"
  fill="#4F5D95" rx="6"/>
  
  <rect x="293.93593131106826" y="0" width="6.064068688931743" height="12"
  fill="#e34c26" rx="6"/>
  
  </g>

  
